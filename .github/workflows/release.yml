name: Windows EXE release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v1.0.0)"
        required: true
        type: string

# The workflow creates a GitHub Release and attaches the complete PyInstaller
# folder as a ZIP.  The EXE alone cannot run because it needs _internal.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Build the Windows application
        run: .\build.bat

      - name: Package the complete application folder
        shell: pwsh
        run: |
          Compress-Archive -Path release\NoesiaHR -DestinationPath "NoesiaHR-${env:RELEASE_TAG}-windows.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Noesia 採用補助AI ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: NoesiaHR-${{ env.RELEASE_TAG }}-windows.zip
